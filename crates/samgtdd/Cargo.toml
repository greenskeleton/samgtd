[package]
name = "samgtdd"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "samgtdd"
path = "src/main.rs"

[dependencies]
samgtd-api = { path = "../samgtd-api" }
samgtd-crdt = { path = "../samgtd-crdt" }
samgtd-store = { path = "../samgtd-store" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serde_json = "1"
tempfile = "3"
